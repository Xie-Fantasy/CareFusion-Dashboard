<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8实时人体检测 - 低延迟流媒体</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #87CEEB;
            margin-bottom: 30px;
        }
        
        .video-container {
            position: relative;
            display: inline-block;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #videoStream {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .status-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 0 20px;
        }
        
        .status-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .status-label {
            font-size: 0.9rem;
            color: #B0C4DE;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00FF7F;
        }
        
        .connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .connected {
            background: #28a745;
            color: white;
        }
        
        .disconnected {
            background: #dc3545;
            color: white;
        }
        
        .connecting {
            background: #ffc107;
            color: black;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .error-message {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff4444;
            color: #ffcccc;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #00FF7F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 YOLOv8实时人体检测</h1>
        <p class="subtitle">低延迟720p@25fps流媒体 | RTX 4060 GPU加速</p>
        
        <div class="video-container">
            <img id="videoStream" alt="视频流加载中..." style="display: none;">
            <div class="loading" id="loading"></div>
            <div class="connection-status connecting" id="connectionStatus">连接中...</div>
            <div class="error-message" id="errorMessage"></div>
        </div>
        
        <div class="status-panel">
            <div class="status-card">
                <div class="status-label">检测到的人数</div>
                <div class="status-value" id="personCount">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">帧率 (FPS)</div>
                <div class="status-value" id="fps">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">延迟 (ms)</div>
                <div class="status-value" id="latency">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">数据大小 (KB)</div>
                <div class="status-value" id="frameSize">-</div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="connect()" id="connectBtn">连接</button>
            <button onclick="disconnect()" id="disconnectBtn" disabled>断开</button>
            <button onclick="toggleFullscreen()">全屏</button>
        </div>
    </div>

    <script>
        let websocket = null;
        let lastFrameTime = 0;
        let frameCount = 0;
        let startTime = Date.now();
        
        const videoStream = document.getElementById('videoStream');
        const loading = document.getElementById('loading');
        const connectionStatus = document.getElementById('connectionStatus');
        const errorMessage = document.getElementById('errorMessage');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        
        // 状态显示元素
        const personCount = document.getElementById('personCount');
        const fpsDisplay = document.getElementById('fps');
        const latencyDisplay = document.getElementById('latency');
        const frameSizeDisplay = document.getElementById('frameSize');
        
        function connect() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                return;
            }
            
            const wsUrl = `ws://localhost:8000/ws/stream`;
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function(event) {
                console.log('WebSocket连接已建立');
                updateConnectionStatus('connected');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                hideError();
                loading.style.display = 'block';
            };
            
            websocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    // 显示视频帧
                    if (data.frame) {
                        videoStream.src = 'data:image/jpeg;base64,' + data.frame;
                        videoStream.style.display = 'block';
                        loading.style.display = 'none';
                    }
                    
                    // 更新统计信息
                    updateStats(data);
                    
                } catch (error) {
                    console.error('解析消息错误:', error);
                    showError('数据解析错误: ' + error.message);
                }
            };
            
            websocket.onerror = function(error) {
                console.error('WebSocket错误:', error);
                showError('连接错误，请检查服务器是否运行在 http://localhost:8000');
                updateConnectionStatus('disconnected');
            };
            
            websocket.onclose = function(event) {
                console.log('WebSocket连接已关闭');
                updateConnectionStatus('disconnected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                videoStream.style.display = 'none';
                loading.style.display = 'none';
            };
        }
        
        function disconnect() {
            if (websocket) {
                websocket.close();
            }
        }
        
        function updateConnectionStatus(status) {
            connectionStatus.className = 'connection-status ' + status;
            switch(status) {
                case 'connected':
                    connectionStatus.textContent = '已连接';
                    break;
                case 'disconnected':
                    connectionStatus.textContent = '未连接';
                    break;
                case 'connecting':
                    connectionStatus.textContent = '连接中...';
                    break;
            }
        }
        
        function updateStats(data) {
            // 更新检测人数
            if (data.detections) {
                personCount.textContent = data.detections.length;
            }
            
            // 计算FPS
            frameCount++;
            const currentTime = Date.now();
            if (currentTime - startTime >= 1000) {
                const fps = frameCount / ((currentTime - startTime) / 1000);
                fpsDisplay.textContent = fps.toFixed(1);
                frameCount = 0;
                startTime = currentTime;
            }
            
            // 计算延迟
            if (data.timestamp) {
                const latency = Date.now() - (data.timestamp * 1000);
                latencyDisplay.textContent = Math.abs(latency).toFixed(0);
            }
            
            // 显示帧大小
            if (data.frame_size) {
                frameSizeDisplay.textContent = (data.frame_size / 1024).toFixed(1);
            }
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function hideError() {
            errorMessage.style.display = 'none';
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoStream.requestFullscreen().catch(err => {
                    console.log('无法进入全屏模式:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // 页面加载时自动连接
        window.onload = function() {
            setTimeout(connect, 1000);
        };
        
        // 页面卸载时关闭连接
        window.onbeforeunload = function() {
            if (websocket) {
                websocket.close();
            }
        };
    </script>
</body>
</html>

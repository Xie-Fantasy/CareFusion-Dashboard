name: yolo-detection
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python核心
  - python=3.10
  
  # PyTorch生态系统 (CUDA 12.1支持RTX 4060)
  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - torchvision=0.16.0
  - torchaudio=2.1.0
  
  # 计算机视觉和图像处理
  - opencv=4.8.1
  - pillow=10.0.1
  
  # 科学计算
  - numpy=1.24.3
  - scipy=1.11.4
  
  # 数据处理
  - pandas=2.1.3
  - matplotlib=3.8.0
  
  # Web框架和异步
  - uvicorn=0.24.0
  
  # 其他工具
  - pyyaml=6.0.1
  - requests=2.31.0
  
  # pip包（conda中不可用的包）
  - pip
  - pip:
    # YOLOv8和相关包
    - ultralytics==8.0.206
    
    # Web框架
    - fastapi==0.104.1
    - python-multipart==0.0.6
    - python-dotenv==1.0.0
    
    # WebSocket支持
    - websockets==12.0
    
    # 图像处理增强
    - imageio==2.31.6
    - scikit-image==0.22.0
    
    # 性能监控
    - psutil==5.9.6
    
    # 日志和调试
    - rich==13.7.0
